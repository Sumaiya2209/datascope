services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-datascope}
      POSTGRES_USER: ${POSTGRES_USER:-datascope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datascope}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-datascope} -d ${POSTGRES_DB:-datascope}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
